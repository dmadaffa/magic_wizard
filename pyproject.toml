[project]
name = "magic-wizard"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.107.1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff==0.16.10",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# E4/E7/E9, F: pyflakes-level errors (unused imports, undefined names, syntax).
# I: import sorting. UP: modern syntax for requires-python >=3.12.
# SIM: simplifications (nested with, etc.). BLE: blind `except Exception`
# must be deliberate. FURB: idiomatic stdlib use (e.g. writelines).
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM", "BLE", "FURB"]
